[pytest]
# pythonpath below needs pytest 7.0; older versions would fail with a misleading ImportError.
minversion = 7.0
testpaths = unit scenarios
pythonpath = .
addopts = --strict-markers
# The scenario groups are not listed here: conftest.py registers one marker per file in groups/.
markers =
    scenario: boots its own server through the server fixture
    characters(*characters): the characters the test's server is built with
    schedule(name): runs the test's server as ageland_harness with the named schedule; game time advances only through server.advance_hours
    real_login: runs the test's server as plain bin/ageland, whose characters log in through the account menu; without it or a schedule, the server is ageland_harness with the real-time schedule and characters enter with its entry token
