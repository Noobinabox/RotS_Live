[pytest]
# pythonpath below needs pytest 7.0; older versions would fail with a misleading ImportError.
minversion = 7.0
testpaths = unit scenarios
pythonpath = .
addopts = --strict-markers
markers =
    scenario: boots its own server through the server fixture
    boot: the server boots on a harness lib and characters log in
    characters(*characters): the characters the test's server is built with
    schedule(name): runs the test's server as ageland_harness with the named schedule; game time advances only through server.advance_hours
    poison: poison ticks once per game hour for its duration, then wears off
    summon: summon cannot reach a player in a dark room, and its zone-distance bonus uses exclusive or
    account_login: the account email and password prompts
    object_versions: object version bumps refresh saved copies at login, keeping play state and the enchants the prototype can take; the test inn's rent refusals
    identify: identify's flag lines, with no lone full stop, and its weapon, food and affection sections
    practice: practice at guildmasters spends the sessions asked for and stops at each one's limits and refusals; sessions follow the formula and pracreset
    tame: tame's zone slot and refusals, and the whistle's flee and recall
    scripts: mob scripts' blocks, section rows, waits and death, crash guards and their reports, hit-point writes, doors and the boot check
    bank: the banker's vault per account and side, its limits, files, refusals, hours and options, what bystanders see, and the vault and gameoptions staff commands
    vendor: the barter vendor's stock list, trades, deducted stock, refusals and options, and the shop commands where no keeper serves
    account_menu: the account menu, roster, account store and account tools behave as #279-#300 shipped them
    resistances: mystic protection in every sphere and unprotect, worn item resistances and vulnerabilities, and how they combine and persist
    help_and_stat: help color, ansi, set and uruk entries; color slots and replies; set preferences and stat flag lines; wizset field matching; stat obj flags and absorb; known bugs as strict xfails
    followers: followers left behind (sitting, delayed, without moves, unseen or riding) and their leaders' ACK lines; followers of a leader that dies where it arrives; group, ungroup and report
    wizlevels: teleport needs level 93 and refuses malformed requests; shutdown is refused at level 95 and reached at 96, where an unknown option shuts nothing down
